
name: Provar lectura de terminis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descarregar repositori
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instal·lar lector de PDF
        run: python -m pip install requests pymupdf

      - name: Examinar referencies als terminis
        run: python prova_terminis.py

      - name: Classificar possibles convocatories
        run: python filtrar_terminis.py

      - name: Agrupar convocatories per expedient
        run: python agrupar_processos.py

      - name: Desar fragments per verificar
        uses: actions/upload-artifact@v4
        with:
          name: terminis-per-verificar
          path: terminis_per_verificar.json
          retention-days: 7
          if-no-files-found: error

      - name: Desar resultat del filtre
        uses: actions/upload-artifact@v4
        with:
          name: resultat-filtre-terminis
          path: resultat_filtre_terminis.json
          retention-days: 7
          if-no-files-found: error

      - name: Desar processos agrupats
        uses: actions/upload-artifact@v4
        with:
          name: processos-per-revisar
          path: processos_per_revisar.json
          retention-days: 7
          if-no-files-found: error
