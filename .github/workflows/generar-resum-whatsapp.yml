name: Generar resum diari WhatsApp
on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'
permissions:
  contents: write
concurrency:
  group: resum-diari-whatsapp
  cancel-in-progress: false
jobs:
  resum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Comparar anuncis i preparar missatge
        run: python generar_resum_whatsapp.py
      - name: Guardar estat i resum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estat_ofertes.json resum_whatsapp.txt
          if ! git diff --cached --quiet; then
            git commit -m "Actualitzar registre diari i resum de WhatsApp"
            git push
          fi
