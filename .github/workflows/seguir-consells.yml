name: Seguiment documents consells comarcals
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seguir-consells
  cancel-in-progress: false
jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instal·lar navegador
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Consultar documents dels consells
        run: python seguir_consells.py
      - name: Desar estat al repositori
        run: |
          if [ -n "$(git status --porcelain -- estat_consells.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estat_consells.json
            git commit -m "Actualitzar estat documents consells"
            git push
          fi
