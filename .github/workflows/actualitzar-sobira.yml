name: Actualitzar ofertes de Sobirà Dinàmic
on:
  schedule:
    - cron: '50 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actualitzar-sobira
  cancel-in-progress: false
jobs:
  actualitzar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descarregar repositori
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instal·lar navegador
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Consultar Sobirà Dinàmic i actualitzar la pàgina
        run: python publicar_sobira.py
      - name: Guardar canvis al repositori
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html estat_sobira.json
            git commit -m "Actualitzar ofertes Sobirà Dinàmic"
            git push
          else
            echo "No hi ha canvis a index.html."
          fi
