name: Actualitzar convocatories Consell Sobira
on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *'
permissions:
  contents: write
concurrency:
  group: publicar-convocatories-sobira
  cancel-in-progress: false
jobs:
  actualitzar:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar repositori
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installar dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Llegir convocatories del Sobira i actualitzar web
        run: python actualitzar_convocatories_sobira.py
      - name: Publicar canvis si n'hi ha
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Actualitzar documents de convocatories del Pallars Sobira"
            git push
          fi
