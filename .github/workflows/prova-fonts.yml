name: Provar connexió a fonts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provar:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar repositori
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprovar la connexió a Sobirà Dinàmic
        run: python actualitzar.py
