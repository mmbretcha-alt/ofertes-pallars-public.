name: Provar connexió a fonts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descarregar repositori
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instal·lar navegador de prova
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Provar lectura de Sobirà Dinàmic
        run: python prova_airtable_navegador.py
